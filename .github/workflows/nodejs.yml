name: Node CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.node-version'
    - name: Clean install dependencies
      run: |
        npm install
    - name: npm build and test
      run: |
        npm run build --if-present
        npm run type-check
        npm run test:run
      env:
        CI: true
